include /etc/nginx/snippets/cloudflare-realip.conf;

server_tokens off;
gzip on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz { access_log off; return 200 "ok\n"; }   # container health check
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    client_max_body_size 64k;

    location /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;           # no trailing slash: keep the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # real client IP (after real_ip)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {                           # hashed file names: cache for a year
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {                                  # React app; index.html must never be cached
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

version: 2
updates:
  # Keeps the actions in .github/workflows up to date, including the ones pinned to a commit SHA
  # (Dependabot updates the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
